[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-research-agent"
version = "0.5.1"
description = "Local-first multi-agent CLI for paper understanding, critical debate, literature intelligence, Scribe-powered writing, and figure generation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yanan Sun", email = "yanan.sun.external@tkelevator.com" },
]
keywords = [
    "arxiv",
    "research",
    "literature-review",
    "cli",
    "llm",
    "multi-agent",
    "paper-summarization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "typer>=0.12",
    "textual>=0.47",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pymupdf>=1.24",
    "chromadb>=0.5",
    "openai>=1.30",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/ynsun-tw/research-helper"
Repository = "https://github.com/ynsun-tw/research-helper"
Issues = "https://github.com/ynsun-tw/research-helper/issues"
Changelog = "https://github.com/ynsun-tw/research-helper/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
research = "research_agent.cli:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
# Source layout: src/research_agent → research_agent/ in the wheel.
# YAML system prompts inside src/research_agent/prompts/ are picked up
# automatically as package data; no force-include needed.
packages = ["src/research_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "examples/",
    "planning/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "network: marks tests that hit live network services (deselect with -m 'not network'; enable with RUN_NETWORK_TESTS=1)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E501 is not in ruff's default `E` group (it's left to the formatter);
# we opt in explicitly so the 100-char limit is enforced by `ruff check`
# locally and in CI, matching the limit other linters in this repo use.
select = ["E", "E501", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["research_agent"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["research_agent"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "textual.*", "fitz.*"]
ignore_missing_imports = true
